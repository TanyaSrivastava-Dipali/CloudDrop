name: CloudDrop CI/CD

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

  workflow_dispatch:

# Cancel an older run on the same branch/PR when a newer commit is pushed.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # -----------------------------------------------
  # CI: Lint
  # -----------------------------------------------
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  # -----------------------------------------------
  # CI: Test
  # -----------------------------------------------
  test:
    name: Test (Node 22)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  # -----------------------------------------------
  # Build the deployment artifact
  # -----------------------------------------------
  package:
    name: Package Application
    runs-on: ubuntu-latest
    needs: [lint, test]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create deployment package
        shell: bash
        run: |
          set -euo pipefail

          # Create the archive outside the repository.
          PACKAGE_DIR="$(mktemp -d)"
          trap 'rm -rf "$PACKAGE_DIR"' EXIT

          tar \
            --exclude='./.git' \
            --exclude='./.github' \
            --exclude='./node_modules' \
            --exclude='./coverage' \
            --exclude='./.env' \
            --exclude='./.env.*' \
            --exclude='./app.tar.gz' \
            --exclude='./npm-debug.log' \
            --exclude='./*.log' \
            -czf "$PACKAGE_DIR/app.tar.gz" \
            .

          # Place the finished archive where the upload step expects it.
          cp "$PACKAGE_DIR/app.tar.gz" "$RUNNER_TEMP/app.tar.gz"

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: cloud-drop
          path: ${{ runner.temp }}/app.tar.gz
          retention-days: 1

  # -----------------------------------------------
  # CD: Deploy to Ubuntu EC2
  # -----------------------------------------------
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: [package]

    # Deploy only after a push to main or a manual run on main.
    # Pull requests never deploy.
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
       github.event_name == 'workflow_dispatch')

    steps:
      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: cloud-drop
          path: ./deployment

      # ---------------------------------------------
      # Configure SSH
      # ---------------------------------------------
      - name: Configure SSH
        shell: bash
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          printf '%s\n' "$EC2_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      # ---------------------------------------------
      # Transfer artifact to EC2
      # ---------------------------------------------
      - name: Transfer package to EC2
        shell: bash
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          set -euo pipefail

          scp \
            -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            ./deployment/app.tar.gz \
            "$EC2_USER@$EC2_HOST:/tmp/cloud-drop.tar.gz"

      # ---------------------------------------------
      # Deploy application
      # ---------------------------------------------
      - name: Deploy application
        shell: bash
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          set -euo pipefail

          ssh \
            -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$EC2_USER@$EC2_HOST" 'bash -se' <<'REMOTE'

            set -euo pipefail

            APP_DIR="/var/www/cloud-drop"
            ARCHIVE="/tmp/cloud-drop.tar.gz"

            # Prepare the application directory.
            mkdir -p "$APP_DIR"

            # Extract the new application files.
            tar -xzf "$ARCHIVE" -C "$APP_DIR"

            cd "$APP_DIR"

            # Install production dependencies only.
            npm ci --omit=dev

            # Start the application or restart the existing PM2 process.
            if pm2 describe cloud-drop >/dev/null 2>&1; then
              pm2 restart cloud-drop --update-env
            else
              pm2 start npm --name cloud-drop -- start
            fi

            # Save the PM2 process list.
            pm2 save

            # Remove the transferred archive.
            rm -f "$ARCHIVE"

            echo "CloudDrop deployment completed successfully."

          REMOTE